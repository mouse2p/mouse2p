<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#1b263b"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#4a9eff"/>
      <stop offset="1" stop-color="#e0a83c"/>
    </linearGradient>
    <clipPath id="clipName"><rect class="typeName" x="40" y="40" width="250" height="46"/></clipPath>
    <clipPath id="clipRole"><rect class="typeRole" x="40" y="92" width="560" height="26"/></clipPath>
    <style>
      .typeName { animation: typeA 1.6s steps(12, end) 0.4s both; }
      .typeRole { animation: typeB 3.2s steps(52, end) 2.2s both; }
      @keyframes typeA { from { width: 0; } to { width: 250px; } }
      @keyframes typeB { from { width: 0; } to { width: 560px; } }
      .cursor { opacity: 0; animation: appear 0.1s linear 5.5s forwards, blink 1.1s step-end 5.5s infinite; }
      @keyframes appear { to { opacity: 1; } }
      @keyframes blink { 50% { opacity: 0; } }
      .bar { transform-box: fill-box; transform-origin: bottom; animation: eq 1.6s ease-in-out infinite alternate; }
      @keyframes eq { from { transform: scaleY(0.45); } to { transform: scaleY(1); } }
      .b1 { animation-delay: 0s; } .b2 { animation-delay: .12s; } .b3 { animation-delay: .24s; }
      .b4 { animation-delay: .36s; } .b5 { animation-delay: .48s; } .b6 { animation-delay: .6s; }
      .b7 { animation-delay: .72s; } .b8 { animation-delay: .84s; } .b9 { animation-delay: .96s; }
      .b10 { animation-delay: 1.08s; } .b11 { animation-delay: 1.2s; } .b12 { animation-delay: 1.32s; }
      .b13 { animation-delay: .18s; } .b14 { animation-delay: .42s; } .b15 { animation-delay: .66s; }
      .b16 { animation-delay: .9s; } .b17 { animation-delay: 1.14s; } .b18 { animation-delay: .3s; }
    </style>
  </defs>
  <rect width="900" height="210" rx="10" fill="url(#bg)"/>
  <!-- decorative waveform, top right -->
  <polyline points="620,42 634,30 648,50 662,24 676,56 690,34 704,46 718,28 732,52 746,38 760,44 774,32 788,48 802,36 816,42 830,30 844,46 858,40"
            fill="none" stroke="#4a9eff" stroke-opacity="0.5" stroke-width="1.6"/>
  <text x="42" y="74" clip-path="url(#clipName)" font-size="36" font-weight="700" fill="#f5f7fa">Wang Yuanyi</text>
  <text x="42" y="112" clip-path="url(#clipRole)" font-size="16" fill="#e0a83c">Speech Recognition · End-to-End Spoken Dialogue · HKU</text>
  <rect class="cursor" x="604" y="98" width="9" height="18" fill="#e0a83c"/>
  <text x="42" y="142" font-size="12.5" fill="#8b98a9">streaming ASR · transducer decoding · code-switch evaluation · duplex turn-taking · offline-first synthetic benchmarks</text>
  <!-- equalizer bars -->
  <g fill="url(#bar)">
    <rect class="bar b1"  x="42"  y="164" width="10" height="34" rx="2"/>
    <rect class="bar b2"  x="58"  y="172" width="10" height="26" rx="2"/>
    <rect class="bar b3"  x="74"  y="158" width="10" height="40" rx="2"/>
    <rect class="bar b4"  x="90"  y="176" width="10" height="22" rx="2"/>
    <rect class="bar b5"  x="106" y="166" width="10" height="32" rx="2"/>
    <rect class="bar b6"  x="122" y="180" width="10" height="18" rx="2"/>
    <rect class="bar b7"  x="138" y="160" width="10" height="38" rx="2"/>
    <rect class="bar b8"  x="154" y="174" width="10" height="24" rx="2"/>
    <rect class="bar b9"  x="170" y="162" width="10" height="36" rx="2"/>
    <rect class="bar b10" x="186" y="178" width="10" height="20" rx="2"/>
    <rect class="bar b11" x="202" y="168" width="10" height="30" rx="2"/>
    <rect class="bar b12" x="218" y="156" width="10" height="42" rx="2"/>
    <rect class="bar b13" x="234" y="176" width="10" height="22" rx="2"/>
    <rect class="bar b14" x="250" y="164" width="10" height="34" rx="2"/>
    <rect class="bar b15" x="266" y="180" width="10" height="18" rx="2"/>
    <rect class="bar b16" x="282" y="170" width="10" height="28" rx="2"/>
    <rect class="bar b17" x="298" y="160" width="10" height="38" rx="2"/>
    <rect class="bar b18" x="314" y="174" width="10" height="24" rx="2"/>
  </g>
  <text x="858" y="192" text-anchor="end" font-size="11" fill="#5c6b80">echo = 回声 · scribe = 书写者 · parley = 会谈</text>
</svg>
